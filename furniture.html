<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Furniture - Konte Studio</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
    <script src="drag-scroll.js"></script>
</head>
<body class="archive-page">
    <header class="header">
        <div class="left"><a href="index.html" class="logo-text">Konte Studio</a></div>
        <div class="center">Furniture</div>
        <div class="right"><a href="contact.html">Contact Us</a></div>
    </header>

    <main class="main-content">
        <!-- Left Sidebar -->
        <section class="sidebar" style="position: sticky; top: 40px; height: calc(100vh - 40px);">
            <div class="sidebar-top">
                <div class="info-grid">
                    <div class="info-item">
                        <span class="info-label">Furniture</span>
                        <p class="info-text">콘테스튜디오에서 제작한 가구 포트폴리오입니다</p>
                    </div>
                </div>
            </div>

            <div class="sidebar-list-area" id="sidebar-list">
                <div class="sidebar-header">
                    <div class="col-client">Client</div>
                    <div class="col-project">Project</div>
                </div>
                <div class="list-container">
                    <div class="list-item" id="link-fn-01" onclick="scrollToProject('fn-01')"><div class="col-client">KONTE</div><div class="col-project">자체제작 카우치</div></div>
                </div>
            </div>
        </section>

        <!-- Right Content: Gallery View -->
        <section class="gallery" id="gallery-root">
            <div class="gallery-item" id="fn-01">
                <div class="gallery-header"><span>KONTE</span><span>자체제작 카우치</span><span></span></div>
                <div class="gallery-image-container">
                    <img src="images/furniture/fn_01_01.jpg" alt="자체제작 카우치 1">
                    <img src="images/furniture/fn_01_02.jpg" alt="자체제작 카우치 2">
                    <img src="images/furniture/fn_01_03.jpg" alt="자체제작 카우치 3">
                    <img src="images/furniture/fn_01_04.jpg" alt="자체제작 카우치 4">
                    <img src="images/furniture/fn_01_05.jpg" alt="자체제작 카우치 5">
                    <img src="images/furniture/fn_01_06.jpg" alt="자체제작 카우치 6">
                    <img src="images/furniture/fn_01_07.png" alt="자체제작 카우치 7">
                    <img src="images/furniture/fn_01_08.png" alt="자체제작 카우치 8">
                    <img src="images/furniture/fn_01_09.png" alt="자체제작 카우치 9">
                    <img src="images/furniture/fn_01_10.png" alt="자체제작 카우치 10">
                    <img src="images/furniture/fn_01_11.png" alt="자체제작 카우치 11">
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        2026.02.16 | IG, Email
    </footer>

    <script>
        function scrollToProject(id) {
            const element = document.getElementById(id);
            if (element) {
                element.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }

        // Scroll Spy Implementation
        const observerOptions = {
            root: null,
            rootMargin: '-40px 0px -70% 0px',
            threshold: 0
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const id = entry.target.id;
                    document.querySelectorAll('.list-item').forEach(item => {
                        item.classList.remove('active');
                    });
                    const activeItem = document.getElementById('link-' + id);
                    if (activeItem) {
                        activeItem.classList.add('active');
                        activeItem.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                    }
                }
            });
        }, observerOptions);

        document.querySelectorAll('.gallery-item').forEach(item => {
            observer.observe(item);
        });
    </script>
</body>
</html>
