<!DOCTYPE html>
<html lang="ko">
<head>

    <title>Furniture - Konte Studio</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
</head>
<body class="archive-page">
    <header class="header">
        <div class="left"><a href="index.html" class="logo-text">Konte Studio</a></div>
        <div class="center">Furniture</div>
        <div class="right"><a href="contact.html">Contact Us</a></div>

    <main class="main-content">
        <!-- Left Sidebar -->
        <section class="sidebar">
            <div class="sidebar-top">
                <div class="info-grid">
                    <div class="info-item">
                        <span class="info-label">Furniture</span>
                        <p class="info-text">콘테스튜디오에서 제작한 가구 포트폴리오입니다</p>
                    </div>
                </div>

            <div class="sidebar-list-area">
                <div class="sidebar-header">
                    <div class="col-client">Client</div>
                    <div class="col-project">Project</div>
                </div>
                <div class="list-container">
                    <div class="list-item" onclick="scrollToProject('fn-01')"><div class="col-client">TAMBURINS</div><div class="col-project">카우치 디자인, 제작</div></div>
                </div>
            </div>
        </section>

                    <img src="images/object/TAMBURINS/03.jpg" alt="카우치 디자인, 제작">
                </div>
            </div>
        </section>

    <footer class="footer">
        2026.02.16 | IG, Email
    </footer>

    <script>
        function scrollToProject(id) {
            const element = document.getElementById(id);
            if (element) {
                element.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }
    </script>
</body>
</html>
